[project]
name = "scrape-werse"
version = "0.1.0"
description = "Global AI Opportunity Tracker — Ingestion Pipeline powered by Bright Data Scraper Studio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
scrape-werse = "scrape_werse.pipeline_orchestrator:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scrape_werse"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

